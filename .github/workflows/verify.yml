name: verify

on:
  push:
  pull_request:

jobs:
  verify-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y p7zip-full p7zip-rar zip unrar xz-utils zstd lz4 bzip2 gzip brotli
      - name: Verify test vectors (fast mode, skips large combination files)
        run: ./verify.sh --fast

  build-harness-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y p7zip-full p7zip-rar zip unrar xz-utils zstd lz4 bzip2 gzip brotli
      - uses: dtolnay/rust-toolchain@stable
      - name: Build harness
        run: cargo build --release --manifest-path harness/Cargo.toml
      - name: Run harness (skip large combination files)
        run: |
          cd harness
          SKIP_COMBINATION=1 ./target/release/harness 2>&1 | tail -3

  harness-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y p7zip-full p7zip-rar zip unrar xz-utils zstd lz4 bzip2 gzip brotli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python harness (skip large combination files)
        run: |
          SKIP_COMBINATION=1 python3 harness_py/run.py 2>&1 | tail -3

  harness-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y p7zip-full p7zip-rar zip unrar xz-utils zstd lz4 bzip2 gzip brotli
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Run Go harness (skip large combination files)
        run: |
          cd harness_go
          SKIP_COMBINATION=1 go run . 2>&1 | tail -3
