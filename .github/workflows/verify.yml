name: verify

on:
  push:
  pull_request:

jobs:
  verify-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y p7zip-full p7zip-rar zip unrar xz-utils zstd lz4 bzip2 gzip brotli
      - name: Download and extract data from Release
        run: |
          for a in rawfiles split password normal; do
            curl -sL -o $a.tar.gz https://github.com/znso4pa/files4testing/releases/latest/download/$a.tar.gz
            tar xzf $a.tar.gz
          done
      - name: Verify test vectors (fast mode, skips large combination files)
        run: ./verify.sh --fast

  build-harness-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: dtolnay/rust-toolchain@stable
      - name: Build harness
        run: cargo build --release --manifest-path harness/Cargo.toml

  harness-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python3 -m py_compile harness_py/run.py

  harness-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build harness
        run: |
          cd harness_go
          go build ./...
          go vet ./...
